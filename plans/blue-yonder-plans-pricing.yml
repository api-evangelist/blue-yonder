specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Blue Yonder
providerId: blue-yonder
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Supply Chain
  - Logistics
  - Retail
  - Warehouse Management
  - Transportation Management
  - AI / SaaS
description: Blue Yonder is an enterprise AI / supply-chain SaaS vendor (planning, retail planning,
  order management, warehouse, transportation, workforce, returns) sold under contact-sales contracts.
  No public per-seat or per-API rate card exists; pricing is configured per deployment scope and
  industry.
sources:
  - https://www.blueyonder.com
notes: Public marketing site lists product modules but no pricing. Reconcile with the active Blue
  Yonder enterprise contract.
plans:
  - id: blue-yonder-platform-enterprise
    name: Blue Yonder Platform (Contact Sales)
    type: enterprise
    description: Custom-negotiated subscription to one or more Blue Yonder solution categories,
      delivered on the Blue Yonder Platform.
    entries:
      - label: Platform subscription
        name: platform_subscription
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Module add-on (Planning, OMS, WMS, TMS, Workforce, etc.)
        name: module_addon
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Blue Yonder Network connectivity
        name: network_connectivity
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Supply Chain Planning
      - name: Retail Planning & Category Management
      - name: Order Management & Commerce
      - name: Returns Management
      - name: Warehouse Management (WMS)
      - name: Transportation Management (TMS)
      - name: Workforce & Labor Management
      - name: Supply Chain Command Center
      - name: Blue Yonder Platform / API access
      - name: Blue Yonder Network
maintainers:
