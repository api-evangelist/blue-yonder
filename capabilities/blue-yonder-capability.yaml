naftiko: 1.0.0-alpha2
info:
  label: Blue Yonder Warehouse Management API
  description: The Blue Yonder Warehouse Management API provides access to warehouse operations data including inventory positions,
    task management, labor optimization, and fulfillment workflows. REST APIs support integration with automation systems,
    robotics, and ERP platforms for distribution center operations.
  tags:
  - Blue
  - Yonder
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: blue-yonder
    baseUri: https://api.blueyonder.example.com
    description: Blue Yonder Warehouse Management API HTTP API.
    authentication:
      type: bearer
      token: '{{BLUE_YONDER_TOKEN}}'
    resources:
    - name: wms-v1-inventory
      path: /wms/v1/inventory
      operations:
      - name: listinventory
        method: GET
        description: List inventory positions
        inputParameters:
        - name: locationId
          in: query
          type: string
          description: Filter by warehouse location
        - name: itemId
          in: query
          type: string
          description: Filter by item/SKU identifier
        - name: status
          in: query
          type: string
        - name: page
          in: query
          type: integer
        - name: pageSize
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: wms-v1-inventory-itemid
      path: /wms/v1/inventory/{itemId}
      operations:
      - name: getinventorybyitem
        method: GET
        description: Get inventory for item
        inputParameters:
        - name: itemId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: wms-v1-receipts
      path: /wms/v1/receipts
      operations:
      - name: listreceipts
        method: GET
        description: List receipts
        inputParameters:
        - name: status
          in: query
          type: string
        - name: fromDate
          in: query
          type: string
        - name: toDate
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createreceipt
        method: POST
        description: Create inbound receipt
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: wms-v1-orders
      path: /wms/v1/orders
      operations:
      - name: listorders
        method: GET
        description: List outbound orders
        inputParameters:
        - name: status
          in: query
          type: string
        - name: priority
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createorder
        method: POST
        description: Create outbound order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: wms-v1-tasks
      path: /wms/v1/tasks
      operations:
      - name: listtasks
        method: GET
        description: List warehouse tasks
        inputParameters:
        - name: taskType
          in: query
          type: string
        - name: assignedTo
          in: query
          type: string
        - name: status
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: blue-yonder-rest
    description: REST adapter for Blue Yonder Warehouse Management API.
    resources:
    - path: /wms/v1/inventory
      name: listinventory
      operations:
      - method: GET
        name: listinventory
        description: List inventory positions
        call: blue-yonder.listinventory
        outputParameters:
        - type: object
          mapping: $.
    - path: /wms/v1/inventory/{itemId}
      name: getinventorybyitem
      operations:
      - method: GET
        name: getinventorybyitem
        description: Get inventory for item
        call: blue-yonder.getinventorybyitem
        with:
          itemId: rest.itemId
        outputParameters:
        - type: object
          mapping: $.
    - path: /wms/v1/receipts
      name: listreceipts
      operations:
      - method: GET
        name: listreceipts
        description: List receipts
        call: blue-yonder.listreceipts
        outputParameters:
        - type: object
          mapping: $.
    - path: /wms/v1/receipts
      name: createreceipt
      operations:
      - method: POST
        name: createreceipt
        description: Create inbound receipt
        call: blue-yonder.createreceipt
        outputParameters:
        - type: object
          mapping: $.
    - path: /wms/v1/orders
      name: listorders
      operations:
      - method: GET
        name: listorders
        description: List outbound orders
        call: blue-yonder.listorders
        outputParameters:
        - type: object
          mapping: $.
    - path: /wms/v1/orders
      name: createorder
      operations:
      - method: POST
        name: createorder
        description: Create outbound order
        call: blue-yonder.createorder
        outputParameters:
        - type: object
          mapping: $.
    - path: /wms/v1/tasks
      name: listtasks
      operations:
      - method: GET
        name: listtasks
        description: List warehouse tasks
        call: blue-yonder.listtasks
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: blue-yonder-mcp
    transport: http
    description: MCP adapter for Blue Yonder Warehouse Management API for AI agent use.
    tools:
    - name: listinventory
      description: List inventory positions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: blue-yonder.listinventory
      with:
        locationId: tools.locationId
        itemId: tools.itemId
        status: tools.status
        page: tools.page
        pageSize: tools.pageSize
      inputParameters:
      - name: locationId
        type: string
        description: Filter by warehouse location
      - name: itemId
        type: string
        description: Filter by item/SKU identifier
      - name: status
        type: string
        description: status
      - name: page
        type: integer
        description: page
      - name: pageSize
        type: integer
        description: pageSize
      outputParameters:
      - type: object
        mapping: $.
    - name: getinventorybyitem
      description: Get inventory for item
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: blue-yonder.getinventorybyitem
      with:
        itemId: tools.itemId
      inputParameters:
      - name: itemId
        type: string
        description: itemId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listreceipts
      description: List receipts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: blue-yonder.listreceipts
      with:
        status: tools.status
        fromDate: tools.fromDate
        toDate: tools.toDate
      inputParameters:
      - name: status
        type: string
        description: status
      - name: fromDate
        type: string
        description: fromDate
      - name: toDate
        type: string
        description: toDate
      outputParameters:
      - type: object
        mapping: $.
    - name: createreceipt
      description: Create inbound receipt
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: blue-yonder.createreceipt
      outputParameters:
      - type: object
        mapping: $.
    - name: listorders
      description: List outbound orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: blue-yonder.listorders
      with:
        status: tools.status
        priority: tools.priority
      inputParameters:
      - name: status
        type: string
        description: status
      - name: priority
        type: string
        description: priority
      outputParameters:
      - type: object
        mapping: $.
    - name: createorder
      description: Create outbound order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: blue-yonder.createorder
      outputParameters:
      - type: object
        mapping: $.
    - name: listtasks
      description: List warehouse tasks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: blue-yonder.listtasks
      with:
        taskType: tools.taskType
        assignedTo: tools.assignedTo
        status: tools.status
      inputParameters:
      - name: taskType
        type: string
        description: taskType
      - name: assignedTo
        type: string
        description: assignedTo
      - name: status
        type: string
        description: status
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    BLUE_YONDER_TOKEN: BLUE_YONDER_TOKEN
