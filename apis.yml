    type: Documentation
  description: >-
    The Blue Yonder Transportation Management API enables access to transportation planning, carrier management,
    load optimization, and freight audit capabilities. REST APIs support carrier connectivity, shipment
    tracking, and transportation cost optimization across multimodal freight networks.
